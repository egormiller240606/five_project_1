[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-factor-zoo"
version = "0.1.0"
description = "Clean-room replication scaffold for Leippold, Wang & Zhou (2022)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.1",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "joblib>=1.3",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
