seed: 42
huber_M: 1.35
validation_metric: mse

models:
  ols_h:
    family: torch_linear
    penalty: none
    epochs: 100
    lr: 0.01
    batch_size: 10000
    patience: 5

  ols3_h:
    family: torch_linear
    features: [bm, mve, mom1m]
    penalty: none
    epochs: 100
    lr: 0.01
    batch_size: 10000
    patience: 5

  pls:
    family: pls
    n_components_grid: [1, 2, 3, 5, 10, 20, 30, 40, 50]

  lasso_h:
    family: torch_linear
    penalty: l1
    lambda_grid: [0.0001, 0.000316, 0.001, 0.00316, 0.01, 0.0316, 0.1]
    epochs: 100
    lr: 0.01
    batch_size: 10000
    patience: 5

  enet_h:
    family: torch_linear
    penalty: elasticnet_paper
    rho: 0.5
    lambda_grid: [0.0001, 0.000316, 0.001, 0.00316, 0.01, 0.0316, 0.1]
    epochs: 100
    lr: 0.01
    batch_size: 10000
    patience: 5

  gbrt_h:
    family: paper_gbrt
    max_depth_grid: [1, 2, 3]
    max_iter_grid: [100, 300, 500, 1000]
    learning_rate_grid: [0.01, 0.1]
    loss: huber

  rf:
    family: random_forest
    max_depth_grid: [1, 3, 5, 7]
    n_estimators_grid: [100, 200, 300]
    max_features_grid: [3, 10, 20, 50]
    n_jobs: -1

  vasa:
    family: vasa
    n_submodels_grid: [50, 100, 200, 300]
    n_components_grid: [5, 10, 20, 30, 50]

  nn1:
    family: neural_net
    hidden_layers: [32]
  nn2:
    family: neural_net
    hidden_layers: [32, 16]
  nn3:
    family: neural_net
    hidden_layers: [32, 16, 8]
  nn4:
    family: neural_net
    hidden_layers: [32, 16, 8, 4]
  nn5:
    family: neural_net
    hidden_layers: [32, 16, 8, 4, 2]

neural_defaults:
  l1_grid: [0.00001, 0.0000316, 0.0001, 0.000316, 0.001, 0.00316, 0.01]
  lr_grid: [0.0001, 0.000316, 0.001, 0.00316, 0.01]
  batch_size_grid: [64, 512, 2048, 10000]
  epochs: 100
  patience: 5
  ensemble: 10
  dropout: 0.2
  dropout_grid: [0.0, 0.1, 0.2, 0.5]
  batch_norm: true
  optimizer: adam
